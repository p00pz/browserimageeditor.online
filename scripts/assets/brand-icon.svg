<!--
  The brand mark, as artwork, in a 24x24 box with no colour of its own — the stroke is supplied by
  whoever composes it (scripts/gen-icons.mjs draws it white on the brand colour).

  Same geometry as public/favicon.svg, which is the mark as it appears in a browser tab. This file
  exists so the app icons are generated from one description of the mark rather than from three
  hand-exported PNGs that drift the first time someone tweaks the logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
  <circle cx="8.5" cy="8.5" r="1.5"></circle>
  <polyline points="21 15 16 10 5 21"></polyline>
</svg>
