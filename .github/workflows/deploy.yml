name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Generate pages and static artifacts
        run: bun run gen

      - name: Build site
        run: bun run build

      - name: Generate service worker
        run: bun run gen:sw

      - name: Audit SEO
        run: node scripts/audit-seo.mjs --strict

      - name: Audit PWA
        run: node scripts/audit-pwa.mjs --strict

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Start production preview
        run: |
          bun run preview -- --host 127.0.0.1 --port 4317 > /tmp/image-editor-preview.log 2>&1 &
          echo $! > /tmp/image-editor-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/image-editor-preview.log
          exit 1

      - name: Run browser product and offline checks
        run: bun run qa:browser

      - name: Run visual layout and accessibility checks
        env:
          PREVIEW_URL: http://127.0.0.1:4317
          ENGINE: chromium
          QA_VISUAL_OUT: /tmp/browser-image-editor-visual
          QA_VISUAL_REPORT: /tmp/browser-image-editor-visual-report.json
        run: |
          mkdir -p "$QA_VISUAL_OUT"
          bun run qa:visual
      - name: Verify iPhone save behavior in WebKit
        env:
          PREVIEW_URL: http://127.0.0.1:4317
        run: bun run qa:ios
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
