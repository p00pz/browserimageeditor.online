          <linearGradient id="logo-mark" x1="1" y1="1" x2="29" y2="29" gradientUnits="userSpaceOnUse">
            <stop class="logo-stop-a" offset="0"></stop>
            <stop class="logo-stop-b" offset="1"></stop>
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="28" height="28" rx="9" fill="url(#logo-mark)"></rect>
        <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="15" cy="15" r="7.5"></circle>
          <path d="M15 11.5 18.03 13.25 18.03 16.75 15 18.5 11.97 16.75 11.97 13.25Z"></path>
          <path d="M15 11.5 15 7.5M18.03 13.25 21.5 11.25M18.03 16.75 21.5 18.75M15 18.5 15 22.5M11.97 16.75 8.5 18.75M11.97 13.25 8.5 11.25"></path>

<!--
  The same generated includes, rendered a second time at body level. The inline nav above lives
  inside .header, and .header carries backdrop-filter, which makes it the containing block for any
  fixed descendant — so a sheet pinned with `inset: auto 0 0 0` inside it resolves against the 60px
  header instead of the viewport and never reaches the bottom of the screen. This copy has no
  backdrop-filter ancestor, so the same rule pins it to the real viewport bottom. Both copies read
  the same generated files, so the two can never drift apart.
-->
<nav id="mobile-menu" class="nav nav-sheet" aria-label="Menu" aria-hidden="true">

    <!--#include partials/nav-tools.html-->
    <!--#include partials/nav-header-pages.html-->
  </ul>
  <!--#include partials/lang-switch.html-->
</nav>
