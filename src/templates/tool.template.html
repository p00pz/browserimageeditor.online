<!DOCTYPE html>
{{{banner}}}
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--#include partials/theme-boot.html-->
  <title>{{title}} | {{siteName}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{{alternates}}}
{{{ogTags}}}
{{{jsonLd}}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{{pwaHead}}}
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
{{{rtlHead}}}
  <script type="application/json" id="tool-config">{{{toolConfig}}}</script>
  <script type="application/json" id="ui-strings">{{{uiStrings}}}</script>
</head>
<body>
  <!--#include partials/{{partials}}header.html-->
  <main class="main" id="main" tabindex="-1">
    <div class="container">
      <nav class="breadcrumb" aria-label="{{{t.ui.chrome.breadcrumb}}}">
        <a href="{{homeHref}}">{{{t.ui.chrome.allTools}}}</a>
        <span class="breadcrumb-separator" aria-hidden="true">/</span>
        <span aria-current="page">{{name}}</span>
      </nav>

      <header class="tool-header">
        <h1>{{h1}}</h1>
        <!--
          The intro is the last thing standing between a phone's viewport and the drop zone, at around
          190px of prose for a typical tool. It keeps its place in the document — a desktop shows it
          exactly where it has always been, and it stays in the served HTML either way — but on a phone
          it folds behind a row the visitor can open if they want the summary.
        -->
        <div class="intro-disclosure" data-collapsible>
          <details><summary>{{{t.ui.tool.introSummary}}}</summary></details>
          <p class="tool-intro disclosure-body">{{intro}}</p>
        </div>
      </header>

{{{body}}}
{{{adSlots}}}
{{{guidesHtml}}}
{{{faqHtml}}}
{{{relatedHtml}}}
    </div>
  </main>
{{{translationNotice}}}
  <!--#include partials/{{partials}}footer.html-->
  <script type="module" src="/assets/js/ui/site.js"></script>
  <!-- The Studio Shell presents the tool's own controls as chips and sliders. It loads before the
       tool script and never touches a value: the tool's hooked controls stay the source of truth. -->
  <script type="module" src="/assets/js/ui/studio.js"></script>
  <script type="module" src="{{toolScript}}"></script>
</body>
</html>
